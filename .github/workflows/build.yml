name: Build Lab Manual

on:
  push:
    branches:
      - "*"
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history and tags, so that `git describe --tags` gives the version
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc wkhtmltopdf xfonts-75dpi
        pipx install mdformat
        pipx inject mdformat mdformat-gfm

    - name: Build HTML and PDF
      run: make build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: lab-manual
        path: |
          build/html/rendeiro-lab_manual.html
          build/pdf/rendeiro-lab_manual.pdf

    - name: Attach HTML and PDF to release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          build/html/rendeiro-lab_manual.html \
          build/pdf/rendeiro-lab_manual.pdf \
          --clobber
